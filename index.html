<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>IPA Kelas 8 — Animasi 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0a0e14; font-family:'Segoe UI',system-ui,sans-serif; }
  canvas { display:block; }
  #ui {
    position:fixed; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:24px; color:#e8f0f8;
  }
  #title {
    font-size:22px; font-weight:600; letter-spacing:.5px;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
    opacity:0; transition:opacity .6s;
  }
  #title.on { opacity:1; }
  #title small {
    display:block; font-size:12px; font-weight:400;
    color:#7a9bb8; margin-top:4px; letter-spacing:1.5px;
    text-transform:uppercase;
  }
  #nav {
    pointer-events:auto; display:flex; gap:8px;
    flex-wrap:wrap; justify-content:center;
  }
  .btn {
    background:rgba(20,32,48,.7); border:1px solid rgba(90,140,190,.35);
    color:#a8c8e8; padding:9px 16px; border-radius:20px;
    font-size:12px; cursor:pointer; transition:all .25s;
    backdrop-filter:blur(8px); letter-spacing:.3px;
  }
  .btn:hover { background:rgba(40,70,110,.85); color:#fff; border-color:#4a90d0; }
  .btn.active {
    background:linear-gradient(135deg,#2a6db0,#1a4d80);
    color:#fff; border-color:#5ab0ff;
    box-shadow:0 0 20px rgba(90,176,255,.4);
  }
  #hint {
    text-align:center; font-size:11px; color:#4a6a88;
    letter-spacing:.5px;
  }
</style>
</head>
<body>
<div id="ui">
  <div id="title"></div>
  <div>
    <div id="nav"></div>
    <div id="hint" style="margin-top:12px">drag untuk putar · scroll untuk zoom</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- SETUP ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.Fog(0x0a0e14, 18, 45);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 4, 14);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.85;
controls.target.set(0, 2, 0);

// ---------- LIGHTS ----------
scene.add(new THREE.AmbientLight(0x406080, 1.2));

const key = new THREE.DirectionalLight(0xbfe0ff, 2.2);
key.position.set(8, 14, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -20;
key.shadow.camera.right = 20;
key.shadow.camera.top = 20;
key.shadow.camera.bottom = -20;
scene.add(key);

const rim = new THREE.PointLight(0x3a7ad0, 80, 40);
rim.position.set(-8, 6, -6);
scene.add(rim);

const warm = new THREE.PointLight(0xff8844, 30, 25);
warm.position.set(6, 3, 8);
scene.add(warm);

// ---------- GROUND ----------
const grid = new THREE.GridHelper(60, 40, 0x2a4a6a, 0x14283a);
grid.position.y = -0.01;
scene.add(grid);

const groundMat = new THREE.MeshStandardMaterial({
  color:0x0e1824, roughness:0.9, metalness:0.1
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- MATERIALS ----------
const matGlass = new THREE.MeshPhysicalMaterial({
  color:0x88c0ff, transparent:true, opacity:0.35,
  roughness:0.1, metalness:0, transmission:0.8, thickness:0.5
});
const matBlue = new THREE.MeshStandardMaterial({ color:0x3a7ad0, roughness:0.35, metalness:0.3 });
const matTeal = new THREE.MeshStandardMaterial({ color:0x2ac0b0, roughness:0.4, metalness:0.2 });
const matRed = new THREE.MeshStandardMaterial({ color:0xe04060, roughness:0.4, metalness:0.2 });
const matOrange = new THREE.MeshStandardMaterial({ color:0xff8844, roughness:0.4, metalness:0.2 });
const matPurple = new THREE.MeshStandardMaterial({ color:0x9050d0, roughness:0.4, metalness:0.2 });
const matWhite = new THREE.MeshStandardMaterial({ color:0xe8f0f8, roughness:0.5, metalness:0.1 });
const matBone = new THREE.MeshStandardMaterial({ color:0xd8d0c0, roughness:0.6, metalness:0.05 });

// ---------- SCENES DATA ----------
const groups = {};

// === 1. UJI NUTRISI ===
{
  const g = new THREE.Group();
  g.position.set(0, 0, 0);
  
  // 4 tabung reaksi
  const tubeGeo = new THREE.CylinderGeometry(0.45, 0.45, 3, 24, 1, true);
  const tubeBottom = new THREE.CircleGeometry(0.45, 24);
  
  const tests = [
    { x:-4.5, color:0x1a1a5a, label:'Amilum', liquid:0x2a2a8a }, // biru kehitaman
    { x:-1.5, color:0xcc4422, label:'Glukosa', liquid:0xdd5533 }, // merah bata
    { x:1.5,  color:0x6030a0, label:'Protein', liquid:0x7040b0 }, // ungu
    { x:4.5,  color:0xc0b040, label:'Lemak', liquid:0xd8c860 }   // noda
  ];
  
  tests.forEach((t, i) => {
    const liquidH = 1.6;
    const liquid = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.4, liquidH, 24),
      new THREE.MeshPhysicalMaterial({
        color:t.liquid, transparent:true, opacity:0.85,
        roughness:0.15, metalness:0.1, transmission:0.3,
        emissive:t.liquid, emissiveIntensity:0.15
      })
    );
    liquid.position.set(t.x, liquidH/2 + 0.1, 0);
    g.add(liquid);
    
    const tube = new THREE.Mesh(tubeGeo, matGlass);
    tube.position.set(t.x, 1.5, 0);
    g.add(tube);
    
    const bottom = new THREE.Mesh(tubeBottom, matGlass);
    bottom.rotation.x = -Math.PI/2;
    bottom.position.set(t.x, 0.1, 0);
    g.add(bottom);
    
    // label ring
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.5, 0.04, 12, 32),
      new THREE.MeshStandardMaterial({ color:t.liquid, emissive:t.liquid, emissiveIntensity:0.6 })
    );
    ring.position.set(t.x, 3.1, 0);
    ring.rotation.x = Math.PI/2;
    g.add(ring);
    
    // floating droplet di atas
    const drop = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 16, 16),
      new THREE.MeshStandardMaterial({ color:t.liquid, emissive:t.liquid, emissiveIntensity:0.8 })
    );
    drop.position.set(t.x, 3.6 + Math.sin(i)*0.2, 0);
    drop.userData.baseY = 3.6;
    drop.userData.phase = i * 1.2;
    g.add(drop);
    groups['drop'+i] = drop;
  });
  
  groups.nutrisi = g;
  scene.add(g);
}

// === 2. JANTUNG & PEREDARAN ===
{
  const g = new THREE.Group();
  g.position.set(0, 0, 0);
  g.visible = false;
  
  // jantung simplified - 2 ventrikel
  const heartShape = new THREE.Shape();
  heartShape.moveTo(0, 1.2);
  heartShape.bezierCurveTo(0.8, 2.2, 2.2, 1.8, 1.4, 0.4);
  heartShape.bezierCurveTo(1.0, -0.2, 0.4, -0.6, 0, -1.0);
  heartShape.bezierCurveTo(-0.4, -0.6, -1.0, -0.2, -1.4, 0.4);
  heartShape.bezierCurveTo(-2.2, 1.8, -0.8, 2.2, 0, 1.2);
  
  const heartGeo = new THREE.ExtrudeGeometry(heartShape, {
    depth:0.8, bevelEnabled:true, bevelSize:0.15, bevelThickness:0.15, bevelSegments:3, curveSegments:24
  });
  heartGeo.center();
  const heart = new THREE.Mesh(heartGeo, matRed);
  heart.position.set(0, 2.5, 0);
  heart.scale.set(1.4, 1.4, 1.4);
  heart.castShadow = true;
  g.add(heart);
  
  // pulse
  heart.userData.pulse = 0;
  groups.heart = heart;
  
  // Aorta & vena - torus tubes
  const vesselCurve1 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.3, 4.2, 0),
    new THREE.Vector3(2, 5, 0.5),
    new THREE.Vector3(4, 4, 0),
    new THREE.Vector3(5, 2, -1),
    new THREE.Vector3(4, 0.5, 0),
    new THREE.Vector3(2, 0.3, 1),
    new THREE.Vector3(0, 1.5, 0.3),
  ]);
  const vessel1 = new THREE.Mesh(
    new THREE.TubeGeometry(vesselCurve1, 64, 0.18, 12, false),
    new THREE.MeshStandardMaterial({ color:0xe04060, emissive:0x801020, emissiveIntensity:0.4, roughness:0.3 })
  );
  g.add(vessel1);
  
  const vesselCurve2 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.3, 4.2, 0),
    new THREE.Vector3(-2, 5, -0.5),
    new THREE.Vector3(-4, 4, 0),
    new THREE.Vector3(-5, 2, 1),
    new THREE.Vector3(-4, 0.5, 0),
    new THREE.Vector3(-2, 0.3, -1),
    new THREE.Vector3(0, 1.5, -0.3),
  ]);
  const vessel2 = new THREE.Mesh(
    new THREE.TubeGeometry(vesselCurve2, 64, 0.18, 12, false),
    new THREE.MeshStandardMaterial({ color:0x3a7ad0, emissive:0x102050, emissiveIntensity:0.4, roughness:0.3 })
  );
  g.add(vessel2);
  
  groups.jantung = g;
  scene.add(g);
}

// === 3. SISTEM EKSKRESI (GINJAL) ===
{
  const g = new THREE.Group();
  g.position.set(0, 0, 0);
  g.visible = false;
  
  // ginjal berbentuk bean
  const kidneyShape = new THREE.Shape();
  kidneyShape.moveTo(0, 0);
  kidneyShape.bezierCurveTo(1.2, 0.5, 1.8, 2, 1.2, 3);
  kidneyShape.bezierCurveTo(0.6, 3.8, -0.4, 3.6, -0.8, 2.8);
  kidneyShape.bezierCurveTo(-1.2, 2, -0.8, 1.2, -0.3, 1);
  kidneyShape.bezierCurveTo(0.2, 0.8, 0.4, 0.4, 0, 0);
  
  const kidneyGeo = new THREE.ExtrudeGeometry(kidneyShape, {
    depth:0.7, bevelEnabled:true, bevelSize:0.2, bevelThickness:0.2, bevelSegments:4, curveSegments:32
  });
  kidneyGeo.center();
  
  const leftKidney = new THREE.Mesh(kidneyGeo, matTeal);
  leftKidney.position.set(-2.2, 2.5, 0);
  leftKidney.rotation.z = 0.15;
  leftKidney.castShadow = true;
  g.add(leftKidney);
  
  const rightKidney = new THREE.Mesh(kidneyGeo, matTeal);
  rightKidney.position.set(2.2, 2.5, 0);
  rightKidney.rotation.z = -0.15;
  rightKidney.scale.x = -1;
  rightKidney.castShadow = true;
  g.add(rightKidney);
  
  // ureter
  const ureterCurve1 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-1.8, 1.5, 0),
    new THREE.Vector3(-1.2, 0.5, 0.3),
    new THREE.Vector3(-0.5, -0.5, 0),
    new THREE.Vector3(0, -1, 0)
  ]);
  const ureter1 = new THREE.Mesh(
    new THREE.TubeGeometry(ureterCurve1, 32, 0.12, 8, false),
    matOrange
  );
  g.add(ureter1);
  
  const ureterCurve2 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(1.8, 1.5, 0),
    new THREE.Vector3(1.2, 0.5, -0.3),
    new THREE.Vector3(0.5, -0.5, 0),
    new THREE.Vector3(0, -1, 0)
  ]);
  const ureter2 = new THREE.Mesh(
    new THREE.TubeGeometry(ureterCurve2, 32, 0.12, 8, false),
    matOrange
  );
  g.add(ureter2);
  
  // kandung kemih
  const bladder = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 24, 24),
    matOrange
  );
  bladder.position.set(0, -1.3, 0);
  bladder.scale.set(1, 0.85, 0.8);
  bladder.castShadow = true;
  g.add(bladder);
  
  // partikel cairan naik
  for (let i = 0; i < 12; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 8, 8),
      new THREE.MeshStandardMaterial({ color:0x88e0d0, emissive:0x40b0a0, emissiveIntensity:0.8 })
    );
    p.userData.t = i / 12;
    p.userData.side = i % 2 === 0 ? 1 : -1;
    g.add(p);
    groups['urine'+i] = p;
  }
  
  groups.ekskresi = g;
  scene.add(g);
}

// === 4. PERNAPASAN (PARU-PARU) ===
{
  const g = new THREE.Group();
  g.position.set(0, 0, 0);
  g.visible = false;
  
  // trakea
  const trachea = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.28, 2.2, 16),
    matBone
  );
  trachea.position.set(0, 4.5, 0);
  g.add(trachea);
  
  // bronkus cabang
  const bronkusL = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.14, 1.4, 12),
    matBone
  );
  bronkusL.position.set(-0.55, 3.2, 0);
  bronkusL.rotation.z = 0.5;
  g.add(bronkusL);
  
  const bronkusR = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.14, 1.4, 12),
    matBone
  );
  bronkusR.position.set(0.55, 3.2, 0);
  bronkusR.rotation.z = -0.5;
  g.add(bronkusR);
  
  // paru-paru (2 lobus tiap sisi)
  function makeLung(x) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.bezierCurveTo(1.2, 0.2, 1.6, 1.8, 1.2, 3);
    shape.bezierCurveTo(0.8, 3.8, -0.2, 3.8, -0.6, 3);
    shape.bezierCurveTo(-1.0, 2, -0.8, 0.6, 0, 0);
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth:1.2, bevelEnabled:true, bevelSize:0.2, bevelThickness:0.2, bevelSegments:4, curveSegments:24
    });
    geo.center();
    const lung = new THREE.Mesh(geo, matGlass);
    lung.position.set(x, 2, 0);
    return lung;
  }
  const lungL = makeLung(-1.8);
  const lungR = makeLung(1.8);
  g.add(lungL, lungR);
  
  // alveolus kecil (partikel)
  for (let i = 0; i < 20; i++) {
    const a = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 8, 8),
      new THREE.MeshStandardMaterial({ color:0xff9060, emissive:0xff6030, emissiveIntensity:0.5, transparent:true, opacity:0.7 })
    );
    a.userData.baseX = (i % 2 === 0 ? -1.8 : 1.8) + (Math.random()-0.5)*1.2;
    a.userData.baseY = 1 + Math.random()*2;
    a.userData.baseZ = (Math.random()-0.5)*0.8;
    a.userData.phase = Math.random()*Math.PI*2;
    a.position.set(a.userData.baseX, a.userData.baseY, a.userData.baseZ);
    g.add(a);
    groups['alv'+i] = a;
  }
  
  groups.pernapasan = g;
  scene.add(g);
}

// === 5. ENERGI & USAHA ===
{
  const g = new THREE.Group();
  g.position.set(0, 0, 0);
  g.visible = false;
  
  // bola di bidang miring
  const ramp = new THREE.Mesh(
    new THREE.BoxGeometry(6, 0.2, 2),
    matPurple
  );
  ramp.position.set(0, 1.5, 0);
  ramp.rotation.z = 0.3;
  ramp.castShadow = true;
  g.add(ramp);
  
  // bola menggelinding
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 24, 24),
    new THREE.MeshStandardMaterial({ color:0xff8844, emissive:0xff5522, emissiveIntensity:0.4, roughness:0.3, metalness:0.4 })
  );
  ball.castShadow = true;
  ball.position.set(-2.5, 2.8, 0);
  g.add(ball);
  groups.ball = ball;
  ball.userData.t = 0;
  
  // panah gaya (arrow)
  const arrowDir = new THREE.Vector3(1, -0.3, 0).normalize();
  const arrow = new THREE.ArrowHelper(arrowDir, new THREE.Vector3(0,0,0), 1.5, 0x5ab0ff, 0.4, 0.25);
  arrow.position.set(2, 2, 0);
  g.add(arrow);
  groups.arrow = arrow;
  
  // partikel energi
  for (let i = 0; i < 8; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 8, 8),
      new THREE.MeshStandardMaterial({ color:0xffcc44, emissive:0xffaa00, emissiveIntensity:1 })
    );
    p.userData.phase = i * 0.5;
    p.position.set(-2 + Math.random()*4, 1 + Math.random()*3, (Math.random()-0.5)*1.5);
    g.add(p);
    groups['energy'+i] = p;
  }
  
  groups.energi = g;
  scene.add(g);
}

// === 6. ARCHIMEDES ===
{
  const g = new THREE.Group();
  g.position.set(0, 0, 0);
  g.visible = false;
  
  // tangki air
  const tankMat = new THREE.MeshPhysicalMaterial({
    color:0x2080c0, transparent:true, opacity:0.25,
    roughness:0.1, transmission:0.5
  });
  const tank = new THREE.Mesh(
    new THREE.CylinderGeometry(3, 3, 5, 32, 1, true),
    tankMat
  );
  tank.position.y = 2.5;
  g.add(tank);
  
  const water = new THREE.Mesh(
    new THREE.CylinderGeometry(2.95, 2.95, 3.5, 32),
    new THREE.MeshPhysicalMaterial({
      color:0x3aa0e0, transparent:true, opacity:0.5,
      roughness:0.2, transmission:0.4
    })
  );
  water.position.y = 1.75;
  g.add(water);
  
  // balok terapung
  const block = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.2, 1.2),
    new THREE.MeshStandardMaterial({ color:0xffaa44, emissive:0xff6600, emissiveIntensity:0.2, roughness:0.3, metalness:0.3 })
  );
  block.position.y = 3.5;
  block.castShadow = true;
  g.add(block);
  groups.block = block;
  
  // panah gaya ke atas
  const upArrow = new THREE.ArrowHelper(
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(0, 3, 0),
    1.2, 0x44ff88, 0.3, 0.2
  );
  g.add(upArrow);
  groups.upArrow = upArrow;
  
  // panah gaya berat
  const downArrow = new THREE.ArrowHelper(
    new THREE.Vector3(0,-1,0),
    new THREE.Vector3(0.6, 3, 0),
    1.0, 0xff4466, 0.3, 0.2
  );
  g.add(downArrow);
  groups.downArrow = downArrow;
  
  groups.archimedes = g;
  scene.add(g);
}

// === 7. TEKANAN HIDROSTATIS ===
{
  const g = new THREE.Group();
  g.position.set(0, 0, 0);
  g.visible = false;
  
  // wadah
  const container = new THREE.Mesh(
    new THREE.CylinderGeometry(3, 3, 6, 32, 1, true),
    new THREE.MeshPhysicalMaterial({
      color:0x4488cc, transparent:true, opacity:0.2, roughness:0.1
    })
  );
  container.position.y = 3;
  g.add(container);
  
  // air
  const waterH = 5;
  const water2 = new THREE.Mesh(
    new THREE.CylinderGeometry(2.95, 2.95, waterH, 32),
    new THREE.MeshPhysicalMaterial({
      color:0x2a80d0, transparent:true, opacity:0.6,
      roughness:0.15, transmission:0.3
    })
  );
  water2.position.y = waterH/2;
  g.add(water2);
  
  // penyelam / bola di kedalaman berbeda
  const depths = [1, 2.5, 4.2];
  depths.forEach((d, i) => {
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 16, 16),
      new THREE.MeshStandardMaterial({ color:0xffcc44, emissive:0xff8800, emissiveIntensity:0.5 })
    );
    ball.position.set((i-1)*1.5, d, 0);
    g.add(ball);
    
    // panah tekanan
    const arrow = new THREE.ArrowHelper(
      new THREE.Vector3(1,0,0),
      new THREE.Vector3((i-1)*1.5 + 0.5, d, 0),
      0.3 + d*0.12, 0xff4466, 0.2, 0.15
    );
    g.add(arrow);
  });
  
  groups.hidrostatis = g;
  scene.add(g);
}

// === SCENE INDEX ===
const sceneList = [
  { key:'nutrisi', name:'Uji Nutrisi', title:'UJI NUTRISI', sub:'Sistem Pencernaan' },
  { key:'jantung', name:'Peredaran Darah', title:'JANTUNG & PEREDARAN', sub:'Sistem Peredaran Darah' },
  { key:'ekskresi', name:'Ekskresi', title:'SISTEM EKSKRESI', sub:'Ginjal & Urine' },
  { key:'pernapasan', name:'Pernapasan', title:'SISTEM PERNAPASAN', sub:'Paru-paru & Alveolus' },
  { key:'energi', name:'Energi & Usaha', title:'ENERGI & USAHA', sub:'Pesawat Sederhana' },
  { key:'archimedes', name:'Archimedes', title:'HUKUM ARCHIMEDES', sub:'Gaya Apung' },
  { key:'hidrostatis', name:'Tekanan', title:'TEKANAN HIDROSTATIS', sub:'Kedalaman & Massa Jenis' }
];

let current = 'nutrisi';
let transitioning = false;

// hide all except nutrisi
Object.entries(groups).forEach(([k, obj]) => {
  if (obj.isGroup && k !== 'nutrisi') obj.visible = false;
});

// UI
const nav = document.getElementById('nav');
const titleEl = document.getElementById('title');

sceneList.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'btn' + (s.key === current ? ' active' : '');
  btn.textContent = s.name;
  btn.dataset.key = s.key;
  btn.onclick = () => switchScene(s.key);
  nav.appendChild(btn);
});

function switchScene(key) {
  if (key === current || transitioning) return;
  transitioning = true;
  
  const oldG = groups[current];
  const newG = groups[key];
  
  // fade out
  let t = 0;
  const fadeOut = setInterval(() => {
    t += 0.05;
    if (t >= 1) {
      clearInterval(fadeOut);
      oldG.visible = false;
      newG.visible = true;
      newG.scale.set(0.01, 0.01, 0.01);
      
      let t2 = 0;
      const fadeIn = setInterval(() => {
        t2 += 0.06;
        const s = Math.min(1, t2);
        newG.scale.setScalar(s);
        if (s >= 1) {
          clearInterval(fadeIn);
          transitioning = false;
        }
      }, 16);
    } else {
      oldG.scale.setScalar(1 - t*0.5);
    }
  }, 16);
  
  current = key;
  document.querySelectorAll('.btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });
  
  const s = sceneList.find(x => x.key === key);
  titleEl.innerHTML = `${s.title}<small>${s.sub}</small>`;
  titleEl.classList.add('on');
}
