<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPA 3D</title><style>body{margin:0;overflow:hidden;background:#0a0e14;font-family:sans-serif;color:#fff}#ui{position:fixed;bottom:20px;width:100%;text-align:center;pointer-events:none;z-index:10}.btn{pointer-events:auto;background:rgba(20,32,48,.8);border:1px solid #4a90d0;color:#fff;padding:8px 12px;margin:4px;border-radius:15px;font-size:12px;cursor:pointer}.btn:active{background:#2a6db0}.btn.active{background:#2a6db0}#title{position:fixed;top:20px;width:100%;text-align:center;font-size:18px;font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none;z-index:10}#title small{display:block;font-size:12px;font-weight:normal;color:#7a9bb8}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body><div id="title">UJI NUTRISI<small>Pencernaan</small></div><div id="ui"></div><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e14);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);camera.position.set(0,4,14);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,2,0);scene.add(new THREE.AmbientLight(0x406080,2));const key=new THREE.DirectionalLight(0xbfe0ff,2);key.position.set(8,14,6);scene.add(key);const grid=new THREE.GridHelper(60,40,0x2a4a6a,0x14283a);scene.add(grid);const matGlass=new THREE.MeshPhysicalMaterial({color:0x88c0ff,transparent:true,opacity:0.35,roughness:0.1,transmission:0.8});const matBlue=new THREE.MeshStandardMaterial({color:0x3a7ad0,roughness:0.35,metalness:0.3});const matTeal=new THREE.MeshStandardMaterial({color:0x2ac0b0,roughness:0.4});const matRed=new THREE.MeshStandardMaterial({color:0xe04060,roughness:0.4});const matPurple=new THREE.MeshStandardMaterial({color:0x9050d0,roughness:0.4});const matOrange=new THREE.MeshStandardMaterial({color:0xff8844,roughness:0.4});const groups={};const gNutrisi=new THREE.Group();const tubeGeo=new THREE.CylinderGeometry(0.45,0.45,3,24,1,true);[-4.5,-1.5,1.5,4.5].forEach((x,i)=>{const c=i===0?0x2a2a8a:i===1?0xdd5533:i===2?0x7040b0:0xd8c860;const l=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.6,24),new THREE.MeshPhysicalMaterial({color:c,transparent:true,opacity:0.85,emissive:c,emissiveIntensity:0.15}));l.position.set(x,0.9,0);gNutrisi.add(l);const t=new THREE.Mesh(tubeGeo,matGlass);t.position.set(x,1.5,0);gNutrisi.add(t)});groups.nutrisi=gNutrisi;scene.add(gNutrisi);const gJantung=new THREE.Group();gJantung.position.set(0,0,0);gJantung.visible=false;const heartGeo=new THREE.SphereGeometry(1.2,32,32);const heart=new THREE.Mesh(heartGeo,matRed);heart.position.set(0,2.5,0);heart.scale.set(1.4,1.4,1.4);gJantung.add(heart);groups.heart=heart;const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,3,0),new THREE.Vector3(3,4,1),new THREE.Vector3(4,1,0),new THREE.Vector3(-3,0,-1),new THREE.Vector3(0,1,0)]);const vessel=new THREE.Mesh(new THREE.TubeGeometry(curve,64,0.2,12,false),matBlue);gJantung.add(vessel);groups.jantung=gJantung;scene.add(gJantung);const gEkskresi=new THREE.Group();gEkskresi.visible=false;const kidney=new THREE.Mesh(new THREE.SphereGeometry(1.4,32,32),matTeal);kidney.scale.set(1,1.4,0.7);kidney.position.set(-2,2,0);gEkskresi.add(kidney);const kidney2=kidney.clone();kidney2.position.set(2,2,0);gEkskresi.add(kidney2);groups.ekskresi=gEkskresi;scene.add(gEkskresi);const gNapas=new THREE.Group();gNapas.visible=false;const lung=new THREE.Mesh(new THREE.SphereGeometry(1.5,32,32),matGlass);lung.position.set(-1.8,2,0);gNapas.add(lung);const lung2=lung.clone();lung2.position.set(1.8,2,0);gNapas.add(lung2);groups.napas=gNapas;scene.add(gNapas);const gEnergi=new THREE.Group();gEnergi.visible=false;const ramp=new THREE.Mesh(new THREE.BoxGeometry(6,0.2,2),matPurple);ramp.position.set(0,1.5,0);ramp.rotation.z=0.3;gEnergi.add(ramp);const ball=new THREE.Mesh(new THREE.SphereGeometry(0.5,24,24),matOrange);ball.position.set(-2,2.8,0);gEnergi.add(ball);groups.ball=ball;groups.energi=gEnergi;scene.add(gEnergi);const gArch=new THREE.Group();gArch.visible=false;const tank=new THREE.Mesh(new THREE.CylinderGeometry(3,3,5,32,1,true),matGlass);tank.position.y=2.5;gArch.add(tank);const water=new THREE.Mesh(new THREE.CylinderGeometry(2.9,2.9,3.5,32),new THREE.MeshPhysicalMaterial({color:0x3aa0e0,transparent:true,opacity:0.5}));water.position.y=1.75;gArch.add(water);const block=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),matOrange);block.position.y=3.5;gArch.add(block);groups.block=block;groups.arch=gArch;scene.add(gArch);const gTekanan=new THREE.Group();gTekanan.visible=false;const cont=new THREE.Mesh(new THREE.CylinderGeometry(3,3,6,32,1,true),matGlass);cont.position.y=3;gTekanan.add(cont);const water2=new THREE.Mesh(new THREE.CylinderGeometry(2.9,2.9,5,32),new THREE.MeshPhysicalMaterial({color:0x2a80d0,transparent:true,opacity:0.6}));water2.position.y=2.5;gTekanan.add(water2);groups.tekanan=gTekanan;scene.add(gTekanan);const scenes=[{k:'nutrisi',n:'Nutrisi',g:groups.nutrisi,t:'UJI NUTRISI',s:'Pencernaan'},{k:'jantung',n:'Jantung',g:groups.jantung,t:'PEREDARAN',s:'Darah'},{k:'ekskresi',n:'Ekskresi',g:groups.ekskresi,t:'EKSKRESI',s:'Ginjal'},{k:'napas',n:'Napas',g:groups.napas,t:'PERNAPASAN',s:'Paru-paru'},{k:'energi',n:'Energi',g:groups.energi,t:'ENERGI',s:'Usaha'},{k:'arch',n:'Archimedes',g:groups.arch,t:'ARCHIMEDES',s:'Gaya Apung'},{k:'tekanan',n:'Tekanan',g:groups.tekanan,t:'TEKANAN',s:'Hidrostatis'}];let cur='nutrisi';const ui=document.getElementById('ui');const title=document.getElementById('title');scenes.forEach(s=>{const b=document.createElement('button');b.className='btn'+(s.k===cur?' active':'');b.textContent=s.n;b.onclick=()=>{if(cur===s.k)return;scenes.forEach(x=>x.g.visible=false);s.g.visible=true;cur=s.k;title.innerHTML=s.t+'<small>'+s.s+'</small>';document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')};ui.appendChild(b)});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const time=clock.getElapsedTime();if(groups.heart)groups.heart.scale.setScalar(1.4+Math.sin(time*3)*0.05);if(groups.ball){groups.ball.position.x=-2+(time%2)*2;groups.ball.position.y=2.8-(time%2)*0.8}if(groups.block)groups.block.position.y=3.5+Math.sin(time*1.5)*0.15;controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
